- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    property: "100acres"
  tasks:
  - name: print the vars
    debug:
      msg: "Hi, I got {{ property }} from my father"

  - name: print the vars again
    vars:
      property: "10acres"
    debug:
      msg: "Hi, I got {{ property }} from my father"